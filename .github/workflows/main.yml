name: Build iOS IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Latest Xcode (iOS 27 SDK)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
      - name: Build iOS App
        run: |
          xcodebuild -project WorkPlot/WorkPlot.xcodeproj \
            -scheme WorkPlot \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WorkPlot.app Payload/
          zip -r WorkPlot.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WorkPlot-IPA
          path: WorkPlot.ipa
