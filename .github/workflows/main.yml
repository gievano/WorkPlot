name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode Version
      run: |
        sudo xcode-select -s /Applications/Xcode.app
        xcodebuild -version

    - name: Compile and Package App Bundle
      run: |
        # Buat folder struktur aplikasi
        mkdir -p Payload/work.plot.app
        
        # Kompilasi Swift murni dengan target iOS arm64
        swiftc Core.swift -o Payload/work.plot.app/work.plot -target arm64-apple-ios15.0 -sdk $(xcrun --sdk iphoneos --show-sdk-path) -parse-as-library
        
        # Buat Info.plist yang lengkap dan valid untuk Sideloadly
        cat << 'EOF' > Payload/work.plot.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>work.plot</string>
            <key>CFBundleIdentifier</key>
            <string>com.work.plot.app</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>work.plot</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UIDeviceFamily</key>
            <array>
                <integer>1</integer>
                <integer>2</integer>
            </array>
        </dict>
        </plist>
        EOF

        # Kompres folder Payload menjadi arsip .ipa yang valid
        mkdir -p Output
        cd Payload
        zip -r ../Output/work.plot.ipa .
        cd ..
        rm -rf Payload

    - name: Upload IPA File
      uses: actions/upload-artifact@v4
      with:
        name: work.plot-ipa
        path: Output/work.plot.ipa

