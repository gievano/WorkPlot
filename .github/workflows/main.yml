name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode Version
      run: |
        sudo xcode-select -s /Applications/Xcode.app
        xcodebuild -version

    - name: Setup Signing & Certificate Profile
      run: |
        # Konfigurasi manajemen sertifikat dan provisioning profile untuk penandatanganan IPA
        echo "[*] Menyiapkan sertifikat aplikasi dan provisioning profile..."
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        
        # Jika menggunakan cert rahasia dari GitHub Secrets (Opsional)
        if [ -n "${{ secrets.CERTIFICATE_P12 }}" ]; then
          echo "${{ secrets.CERTIFICATE_P12 }}" | base64 --decode > certificate.p12
          security create-keychain -p "buildpass" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "buildpass" build.keychain
          security import certificate.p12 -k build.keychain -P "${{ secrets.CERTIFICATE_PASSWORD }}" -A
          security set-keychain-settings -t 3600 -u build.keychain
          echo "[+] Sertifikat berhasil diimpor ke keychain."
        else
          echo "[*] Menggunakan mode unsigned / simulasi penandatanganan lokal."
        fi

    - name: Compile and Package Valid iOS Bundle
      run: |
        rm -rf Payload Output
        mkdir -p Payload/work.plot.app
        
        # Kompilasi Swift dengan menghubungkan UIKit, SwiftUI, dan Foundation secara eksplisit
        swiftc Core.swift -o Payload/work.plot.app/work.plot \
          -target arm64-apple-ios15.0 \
          -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
          -framework SwiftUI \
          -framework UIKit \
          -framework Foundation \
          -parse-as-library
        
        # Buat PkgInfo yang wajib ada pada aplikasi iOS standar
        echo -n "APPL????" > Payload/work.plot.app/PkgInfo
        
        # Buat Info.plist lengkap dengan identitas bundle dan konfigurasi UIWindow & UI/UX Support
        cat << 'EOF' > Payload/work.plot.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>work.plot</string>
            <key>CFBundleIdentifier</key>
            <string>com.work.plot.system</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>work.plot</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UIDeviceFamily</key>
            <array>
                <integer>1</integer>
                <integer>2</integer>
            </array>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
                <string>arm64</string>
            </array>
        </dict>
        </plist>
        EOF

        # Bersihkan file sampah tersembunyi macOS
        find Payload -name ".DS_Store" -delete
        find Payload -name "._*" -delete

        # Arsipkan ke dalam format IPA dengan ukuran biner fungsional yang valid
        mkdir -p Output
        cd Payload
        zip -r ../Output/work.plot.ipa . -x "*.DS_Store" "*/*/.DS_Store"
        cd ..

    - name: Upload IPA File
      uses: actions/upload-artifact@v4
      with:
        name: work.plot-ipa
        path: Output/work.plot.ipa
        if-no-files-found: error

