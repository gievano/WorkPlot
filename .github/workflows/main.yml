name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode Version
      run: |
        sudo xcode-select -s /Applications/Xcode.app
        xcodebuild -version

    - name: Compile and Package Valid iOS Bundle with Icon Support
      run: |
        rm -rf Payload Output
        mkdir -p Payload/work.plot.app
        
        # Kompilasi Swift dengan menghubungkan UIKit, SwiftUI, dan Foundation secara eksplisien
        swiftc Core.swift -o Payload/work.plot.app/work.plot \
          -target arm64-apple-ios15.0 \
          -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
          -framework SwiftUI \
          -framework UIKit \
          -framework Foundation \
          -parse-as-library
        
        # Buat PkgInfo standar aplikasi iOS
        echo -n "APPL????" > Payload/work.plot.app/PkgInfo
        
        # Buat direktori dan placeholder ikon aset agar dikenali penginstal signing (KSign/Sideloadly)
        mkdir -p Payload/work.plot.app/Assets.xcassets/AppIcon.appiconset
        cat << 'EOF' > Payload/work.plot.app/Assets.xcassets/AppIcon.appiconset/Contents.json
        {
          "images" : [
            {
              "idiom" : "universal",
              "platform" : "ios",
              "size" : "1024x1024"
            }
          ],
          "info" : {
            "author" : "xcode",
            "version" : 1
          }
        }
        EOF
        
        # Buat Info.plist lengkap dengan metadata ikon, bundle ID, dan orientasi
        cat << 'EOF' > Payload/work.plot.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>work.plot</string>
            <key>CFBundleIdentifier</key>
            <string>com.work.plot.system</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>work.plot</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UIDeviceFamily</key>
            <array>
                <integer>1</integer>
                <integer>2</integer>
            </array>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
                <string>arm64</string>
            </array>
            <key>CFBundleIcons</key>
            <dict>
                <key>CFBundlePrimaryIcon</key>
                <dict>
                    <key>CFBundleIconFiles</key>
                    <array>
                        <string>AppIcon</string>
                    </array>
                </dict>
            </dict>
        </dict>
        </plist>
        EOF

        # Bersihkan file sampah tersembunyi macOS
        find Payload -name ".DS_Store" -delete
        find Payload -name "._*" -delete

        # Arsipkan ke dalam format IPA dengan ukuran biner fungsional yang valid
        mkdir -p Output
        cd Payload
        zip -r ../Output/work.plot.ipa . -x "*.DS_Store" "*/*/.DS_Store"
        cd ..

    - name: Upload IPA File
      uses: actions/upload-artifact@v4
      with:
        name: work.plot-ipa
        path: Output/work.plot-ipa
        if-no-files-found: error

