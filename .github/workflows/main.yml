name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode Version
      run: |
        sudo xcode-select -s /Applications/Xcode.app
        xcodebuild -version

    - name: Compile Swift Library
      run: |
        swiftc Core.swift -emit-library -o libworkplot.dylib

    - name: Create Proper IPA Structure
      run: |
        mkdir -p Payload/work.plot.app
        mv libworkplot.dylib Payload/work.plot.app/
        
        # Buat Info.plist minimal agar valid sebagai aplikasi iOS
        cat << 'EOF' > Payload/work.plot.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        dict>
            <key>CFBundleIdentifier</key>
            <string>com.work.plot</string>
            <key>CFBundleName</key>
            <string>work.plot</string>
            <key>CFBundleExecutable</key>
            <string>libworkplot.dylib</string>
            <key>CFBundleVersion</key>
            <string>1.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>MinimumOSVersion</key>
            <string>27.0</string>
        </dict>
        </plist>
        EOF
        
        mkdir -p Output
        zip -r Output/work.plot.ipa Payload
        rm -rf Payload

    - name: Upload IPA File
      uses: actions/upload-artifact@v4
      with:
        name: work.plot-ipa
        path: Output/work.plot.ipa

