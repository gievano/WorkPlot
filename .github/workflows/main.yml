name: Build iOS IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6 (iOS 27 SDK)
        run: |
          test -d "/Applications/Xcode_26.6.app/Contents/Developer"
          sudo xcode-select -s "/Applications/Xcode_26.6.app/Contents/Developer"
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          test "$sdk_version" = "27.0"
          echo "iOS SDK: $sdk_version"
      - name: Build iOS App
        run: |
          xcodebuild -project WorkPlot/WorkPlot.xcodeproj \
            -scheme WorkPlot \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WorkPlot.app Payload/
          zip -r WorkPlot.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WorkPlot-IPA
          path: WorkPlot.ipa
