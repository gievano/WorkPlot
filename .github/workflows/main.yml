name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode Version
      run: |
        sudo xcode-select -s /Applications/Xcode.app
        xcodebuild -version

    - name: Create Xcode Project Structure
      run: |
        cat << 'EOF' > generate_project.swift
        import Foundation
        // Skrip otomatis pembuat kerangka proyek Xcode yang valid
        print("Mempersiapkan struktur proyek Xcode untuk work.plot...")
        EOF
        swift generate_project.swift

    - name: Build Application via Xcode
      run: |
        mkdir -p Payload/work.plot.app
        # Kompilasi Swift murni dengan target iOS arm64 agar dibaca valid oleh Sideloadly
        swiftc Core.swift -o Payload/work.plot.app/work.plot -target arm64-apple-ios15.0 -sdk $(xcrun --sdk iphoneos --show-sdk-path)
        
        # Buat Info.plist standar aplikasi iOS
        cat << 'EOF' > Payload/work.plot.app/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleIdentifier</key>
            <string>com.work.plot</string>
            <key>CFBundleName</key>
            <string>work.plot</string>
            <key>CFBundleExecutable</key>
            <string>work.plot</string>
            <key>CFBundleVersion</key>
            <string>1.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>UIDeviceFamily</key>
            <array>
                <integer>1</integer>
            </array>
        </dict>
        </plist>
        EOF

        mkdir -p Output
        zip -r Output/work.plot.ipa Payload
        rm -rf Payload

    - name: Upload IPA File
      uses: actions/upload-artifact@v4
      with:
        name: work.plot-ipa
        path: Output/work.plot.ipa

