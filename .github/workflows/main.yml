name: Build unsigned IPA

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project WorkPlot/WorkPlot.xcodeproj \
            -scheme WorkPlot \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/WorkPlot.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R \
            "$RUNNER_TEMP/WorkPlot.xcarchive/Products/Applications/WorkPlot.app" \
            "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry WorkPlot.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WorkPlot-IPA
          path: ${{ runner.temp }}/WorkPlot.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built IPA
        uses: actions/download-artifact@v4
        with:
          name: WorkPlot-IPA

      - name: Attach IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: WorkPlot.ipa
          generate_release_notes: true
