name: Build unsigned IPA

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check CacheData patcher
        run: |
          CHECK_BIN="$RUNNER_TEMP/check-cachedata"
          xcrun swiftc \
            WorkPlot/Managers/CacheDataPatcher.swift \
            Support/CacheDataPatcherCheck.swift \
            -o "$CHECK_BIN"
          "$CHECK_BIN"

      - name: Check transactional inode writer
        run: |
          CHECK_BIN="$RUNNER_TEMP/check-inode-writer"
          xcrun swiftc \
            WorkPlot/Managers/InodeWriter.swift \
            Support/InodeWriterCheck.swift \
            -o "$CHECK_BIN"
          "$CHECK_BIN"

      - name: Check safe file operations
        run: |
          CHECK_BIN="$RUNNER_TEMP/check-file-operations"
          xcrun swiftc -parse-as-library \
            Support/FileBrowserServiceCheck.swift \
            -o "$CHECK_BIN"
          "$CHECK_BIN"

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project WorkPlot/WorkPlot.xcodeproj \
            -scheme WorkPlot \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/WorkPlot.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R \
            "$RUNNER_TEMP/WorkPlot.xcarchive/Products/Applications/WorkPlot.app" \
            "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry WorkPlot.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WorkPlot-IPA
          path: ${{ runner.temp }}/WorkPlot.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built IPA
        uses: actions/download-artifact@v4
        with:
          name: WorkPlot-IPA

      - name: Attach IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: WorkPlot.ipa
          generate_release_notes: true

  latest-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Download built IPA
        uses: actions/download-artifact@v4
        with:
          name: WorkPlot-IPA

      - name: Prepare dynamic release metadata
        id: meta
        env:
          SHA_FULL: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          SHORT_SHA="${SHA_FULL::7}"
          echo "title=WorkPlot dev 1.0.${BUILD_NUMBER} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"
          BODY_FILE="${RUNNER_TEMP}/release-body.md"
          {
            echo "Automated build from commit \`${SHA_FULL}\` on main."
            echo ""
            echo "### Latest changes"
            echo ""
            echo '```'
            git log --oneline -5 --no-decorate
            echo '```'
            echo ""
            echo "Built: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "> ⚠️ This is a dev prerelease (unsigned IPA) that gets overwritten by the next build. For stable releases, use \`v*\` tags."
          } > "$BODY_FILE"
          echo "body_path=${BODY_FILE}" >> "$GITHUB_OUTPUT"

      - name: Delete previous rolling release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y -R "$GITHUB_REPOSITORY" || true

      - name: Attach IPA to rolling 'latest' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ${{ steps.meta.outputs.title }}
          body_path: ${{ steps.meta.outputs.body_path }}
          files: WorkPlot.ipa
          prerelease: true
          make_latest: false
          generate_release_notes: false
