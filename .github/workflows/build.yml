name: Build work.plot IPA Package

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App and Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Xcode Environment
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Prepare App Payload Directory
        run: |
          mkdir -p Payload/work.plot.app
          
          # Membuat file Info.plist lengkap
          cat << 'EOF' > Payload/work.plot.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.work.plot</string>
              <key>CFBundleName</key>
              <string>work.plot</string>
              <key>CFBundleDisplayName</key>
              <string>work.plot</string>
              <key>CFBundleExecutable</key>
              <string>work.plot</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>MinimumOSVersion</key>
              <string>17.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
              </array>
              <key>UILaunchScreen</key>
              <dict/>
              <key>CFBundleIconFiles</key>
              <array>
                  <string>AppIcon60x60</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Generate App Icon
        run: |
          # Menggunakan sips bawaan macOS untuk membuat gambar icon tanpa library python luar
          mkdir -p icon_tmp
          cat << 'EOF' > icon_tmp/gen.swift
          import Cocoa

          let size = NSSize(width: 180, height: 180)
          let image = NSImage(size: size)
          image.lockFocus()

          let ctx = NSGraphicsContext.current?.cgContext
          ctx?.setFillColor(CGColor(red: 0.05, green: 0.1, blue: 0.2, alpha: 1.0))
          ctx?.fill(CGRect(x: 0, y: 0, width: 180, height: 180))

          ctx?.setFillColor(CGColor(red: 0.2, green: 0.5, blue: 1.0, alpha: 1.0))
          ctx?.fillEllipse(in: CGRect(x: 30, y: 30, width: 120, height: 120))

          image.unlockFocus()

          if let tiff = image.tiffRepresentation, let bitmap = NSBitmapImageRep(data: tiff), let png = bitmap.representation(using: .png, properties: [:]) {
              try? png.write(to: URL(fileURLWithPath: "Payload/work.plot.app/AppIcon60x60@3x.png"))
              try? png.write(to: URL(fileURLWithPath: "Payload/work.plot.app/AppIcon60x60@2x.png"))
          }
          EOF
          swift icon_tmp/gen.swift

      - name: Compile Swift Application Binary
        run: |
          SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # Menyusun aplikasi dengan entry point UIApplicationMain
          swiftc -target arm64-apple-ios17.0 \
            -sdk $SDKPATH \
            -O \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            work_plot_app.swift \
            -o Payload/work.plot.app/work.plot

      - name: Package Payload into IPA
        run: |
          zip -r work.plot.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: work.plot-unsigned-ipa
          path: work.plot.ipa

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          files: work.plot.ipa
          tag_name: v1.0.0
          name: "work.plot iOS 27 Utility Release"
          body: "Official Unsigned IPA package for work.plot built via GitHub Actions with full UI/UX and App Icon support."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

