name: Build work.plot IPA Package

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App and Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Xcode Environment
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Prepare App Payload Directory
        run: |
          mkdir -p Payload/work.plot.app
          
          # Membuat file Info.plist lengkap
          cat << 'EOF' > Payload/work.plot.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.work.plot</string>
              <key>CFBundleName</key>
              <string>work.plot</string>
              <key>CFBundleDisplayName</key>
              <string>work.plot</string>
              <key>CFBundleExecutable</key>
              <string>work.plot</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>MinimumOSVersion</key>
              <string>17.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
              </array>
              <key>UILaunchScreen</key>
              <dict/>
              <key>CFBundleIconFiles</key>
              <array>
                  <string>AppIcon60x60</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Generate App Icon File
        run: |
          # Buat placeholder ikon menggunakan tool sips bawaan macOS (ringan & stabil)
          mkdir -p icon_build
          echo '<svg width="180" height="180" xmlns="http://www.w3.org/2000/svg"><rect width="180" height="180" fill="#0f172a"/><circle cx="90" cy="90" r="60" fill="#3b82f6"/></svg>' > icon_build/icon.svg
          sips -s format png icon_build/icon.svg --out Payload/work.plot.app/AppIcon60x60@3x.png
          sips -z 120 120 Payload/work.plot.app/AppIcon60x60@3x.png --out Payload/work.plot.app/AppIcon60x60@2x.png

      - name: Compile Swift Application Binary
        run: |
          SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # Menyusun aplikasi Swift dengan menyertakan seluruh modul framework iOS yang diperlukan
          swiftc -target arm64-apple-ios17.0 \
            -sdk $SDKPATH \
            -O \
            -parse-as-library \
            -Xlinker -rpath -Xlinker /System/Library/Frameworks \
            -Xlinker -rpath -Xlinker /usr/lib/swift \
            work_plot_app.swift \
            -o Payload/work.plot.app/work.plot

      - name: Package Payload into IPA
        run: |
          zip -r work.plot.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: work.plot-unsigned-ipa
          path: work.plot.ipa

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          files: work.plot.ipa
          tag_name: v1.0.0
          name: "work.plot iOS 27 Utility Release"
          body: "Official Unsigned IPA package for work.plot built via GitHub Actions with full UI/UX and App Icon support."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

