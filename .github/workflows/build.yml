name: Build work.plot IPA

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Prepare Build Directory & Info.plist
        run: |
          mkdir -p Payload/work.plot.app
          
          # Membuat file Info.plist untuk aplikasi work.plot
          cat << 'EOF' > Payload/work.plot.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.work.plot</string>
              <key>CFBundleName</key>
              <string>work.plot</string>
              <key>CFBundleExecutable</key>
              <string>work.plot</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>MinimumOSVersion</key>
              <string>27.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
              </array>
              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </plist>
          EOF

      - name: Compile Swift Code to Binary
        run: |
          # Kompiliasi berkas Swift menggunakan swiftc SDK iPhoneOS
          SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          swiftc -target arm64-apple-ios17.0 \
            -sdk $SDKPATH \
            -import-objc-header /dev/null \
            -parse-as-library \
            -O \
            work_plot_app.swift \
            -o Payload/work.plot.app/work.plot

      - name: Package App into IPA File
        run: |
          # Mengompres direktori Payload menjadi berkas work.plot.ipa
          zip -r work.plot.ipa Payload/

      - name: Upload Build Artifact (IPA)
        uses: actions/upload-artifact@v4
        with:
          name: work.plot-unsigned-ipa
          path: work.plot.ipa

      - name: Create GitHub Release (On Tag/Dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          files: work.plot.ipa
          tag_name: v1.0.0
          name: "work.plot iOS 27 Release"
          body: "Unsigned IPA file for work.plot built automatically via GitHub Actions."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

