name: Build work.plot IPA Package

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App and Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Xcode Environment
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Generate App Bundle & AppIcon Assets
        run: |
          mkdir -p Payload/work.plot.app
          
          # Membuat file Info.plist lengkap
          cat << 'EOF' > Payload/work.plot.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.work.plot</string>
              <key>CFBundleName</key>
              <string>work.plot</string>
              <key>CFBundleDisplayName</key>
              <string>work.plot</string>
              <key>CFBundleExecutable</key>
              <string>work.plot</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>MinimumOSVersion</key>
              <string>17.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
              </array>
              <key>UILaunchScreen</key>
              <dict/>
              <key>CFBundleIconFiles</key>
              <array>
                  <string>AppIcon60x60</string>
              </array>
          </dict>
          </plist>
          EOF

          # Generate Ikon Aplikasi Sederhana menggunakan Python Pillow bawaan macOS
          python3 -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGB', (180, 180), color=(15, 23, 42))
          d = ImageDraw.Draw(img)
          d.rectangle([20, 20, 160, 160], outline=(59, 130, 246), width=8)
          d.ellipse([50, 50, 130, 130], fill=(59, 130, 246))
          img.save('Payload/work.plot.app/AppIcon60x60@3x.png')
          img.resize((120, 120)).save('Payload/work.plot.app/AppIcon60x60@2x.png')
          "

      - name: Compile Swift Application Binary
        run: |
          SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          swiftc -target arm64-apple-ios17.0 \
            -sdk $SDKPATH \
            -import-objc-header /dev/null \
            -parse-as-library \
            -O \
            -framework SwiftUI \
            -framework UIKit \
            -framework Foundation \
            -framework CoreGraphics \
            work_plot_app.swift \
            -o Payload/work.plot.app/work.plot

      - name: Package Payload into IPA
        run: |
          zip -r work.plot.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: work.plot-unsigned-ipa
          path: work.plot.ipa

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          files: work.plot.ipa
          tag_name: v1.0.0
          name: "work.plot iOS 27 Utility Release"
          body: "Official Unsigned IPA package for work.plot built via GitHub Actions with full UI/UX and App Icon support."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

