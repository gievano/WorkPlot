name: Build work.plot IPA Package

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App and Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Xcode Environment
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Prepare App Payload Directory
        run: |
          mkdir -p Payload/work.plot.app
          
          # Info.plist standar tanpa kustomisasi rumit
          cat << 'EOF' > Payload/work.plot.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.work.plot</string>
              <key>CFBundleName</key>
              <string>work.plot</string>
              <key>CFBundleDisplayName</key>
              <string>work.plot</string>
              <key>CFBundleExecutable</key>
              <string>work.plot</string>
              <key>CFBundleVersion</key>
              <string>1.0.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>MinimumOSVersion</key>
              <string>17.0</string>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
              </array>
              <key>UILaunchScreen</key>
              <dict/>
          </dict>
          </plist>
          EOF

      - name: Compile Swift Application Binary
        run: |
          SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # Compile SwiftUI @main murni secara langsung
          swiftc -target arm64-apple-ios17.0 \
            -sdk $SDKPATH \
            -O \
            work_plot_app.swift \
            -o Payload/work.plot.app/work.plot

      - name: Package Payload into IPA
        run: |
          zip -r work.plot.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: work.plot-unsigned-ipa
          path: work.plot.ipa

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          files: work.plot.ipa
          tag_name: v1.0.0
          name: "work.plot iOS 27 Utility Release"
          body: "Unsigned IPA package for work.plot built via GitHub Actions."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

