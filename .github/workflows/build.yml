name: Build work.plot IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.0'

    - name: Verify Environment
      run: |
        swift --version
        xcodebuild -version

    - name: Build Swift Package
      run: |
        swift build -c release

    - name: Package App Artifact
      run: |
        mkdir -p Payload
        # Menyalin hasil build binary ke folder Payload untuk di-zip menjadi .ipa
        cp -r .build/release/WorkPlotCore Payload/ || true
        zip -r work.plot.ipa Payload

    - name: Upload Artifact IPA
      uses: actions/upload-artifact@v4
      with:
        name: work.plot-ipa
        path: |
          *.ipa
          Payload/
